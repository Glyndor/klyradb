name: CI

# klyradb does not consume any reusable from .github today (its own go-ci
# lane is not exposed by the org's reusable set), but the per-repo guard
# pair runs against this repository's own state the same way it does in
# the other consumers: pin-policy checks every reusable pin in this
# repo's workflows against the latest .github tag, and dependabot-
# freshness fails when a Dependabot pull request has not been opened in
# `max-age-days` days. Both stay advisory.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0
    with:
      msrv: "1.96"
      extra-os: '["macos-latest", "windows-latest"]'
      coverage-threshold: 90
      # The engine, installer and bridge layers shell out to real database
      # tooling and the Tauri runtime, so they are exercised by the live
      # DB-integration and app smoke gate rather than unit tests; only their
      # pure logic is unit-covered.
      coverage-exclude: "internal/(pg|mysql|mariadb|mongodb|redis|install|commands)/|internal/main.rs"

  audit:
    uses: Glyndor/.github/.github/workflows/rust-audit.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0

  supply-chain:
    uses: Glyndor/.github/.github/workflows/rust-supply-chain.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0

  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0
    with:
      hard-limit: 500
      soft-limit: 300
      extensions: "rs"

  dco:
    uses: Glyndor/.github/.github/workflows/dco.yml@367c6651f8a8055085e7cb1e3c289e68f105e1c4 # v1.7.0

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@8517d94fde00466f59b95c5d1bd838e2ad24a8bf # v1.15.2

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@8517d94fde00466f59b95c5d1bd838e2ad24a8bf # v1.15.2
    with:
      max-age-days: 15