name: CI

# klyradb does not consume any reusable from .github today (its own go-ci
# lane is not exposed by the org's reusable set), but the per-repo guard
# pair runs against this repository's own state the same way it does in
# the other consumers: pin-policy checks every reusable pin in this
# repo's workflows against the latest .github tag, and dependabot-
# freshness fails when a Dependabot pull request has not been opened in
# `max-age-days` days. Both stay advisory.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0
    with:
      msrv: "1.96"
      extra-test-os: '["macos-latest", "windows-latest"]'
      coverage-threshold: 90
      # The engine, installer and bridge layers shell out to real database
      # tooling and the Tauri runtime, so they are exercised by the live
      # DB-integration and app smoke gate rather than unit tests; only their
      # pure logic is unit-covered.
      coverage-ignore-regex: "internal/(pg|mysql|mariadb|mongodb|redis|install|commands)/|internal/engine/paths.rs|internal/main.rs"

  audit:
    uses: Glyndor/.github/.github/workflows/rust-audit.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0

  supply-chain:
    uses: Glyndor/.github/.github/workflows/rust-supply-chain.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0

  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0
    with:
      hard-limit: 500
      soft-limit: 300
      extensions: "rs"

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@e70ff47fd8aefa0f054846815f19b98768d61122 # v1.17.0
    with:
      max-age-days: 15