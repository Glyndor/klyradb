name: CI

# klyradb does not consume any reusable from .github today (its own go-ci
# lane is not exposed by the org's reusable set), but the per-repo guard
# pair runs against this repository's own state the same way it does in
# the other consumers: pin-policy checks every reusable pin in this
# repo's workflows against the latest .github tag, and dependabot-
# freshness fails when a Dependabot pull request has not been opened in
# `max-age-days` days. Both stay advisory.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Test with coverage
        run: go test ./internal/... -coverprofile=coverage.out -covermode=atomic

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G204,G302,G304 ./...

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@925d55b1f816a8a0c0bcfb3838a88ced31d0bff4 # v1.14.2

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@925d55b1f816a8a0c0bcfb3838a88ced31d0bff4 # v1.14.2
    with:
      max-age-days: 15
