name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: true

      - name: Test
        run: go test ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: true

      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        env:
          GOFLAGS: "-mod=mod"

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: wails build -tags webkit2_41
        env:
          GOFLAGS: "-mod=mod"

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: wails build -nsis
        env:
          GOFLAGS: "-mod=mod"

      - name: Build (macOS)
        if: matrix.name == 'macos'
        run: wails build
        env:
          GOFLAGS: "-mod=mod"

      - name: Rename artifact (Linux)
        if: matrix.name == 'linux'
        run: mv build/bin/klyradb build/bin/klyradb-linux-amd64

      - name: Rename artifacts (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          Move-Item build/bin/klyradb.exe build/bin/klyradb-windows-amd64.exe
          if (Test-Path "build/bin/klyradb-amd64-installer.exe") {
            Move-Item build/bin/klyradb-amd64-installer.exe build/bin/klyradb-windows-amd64-setup.exe
          }

      - name: Package .app (macOS)
        if: matrix.name == 'macos'
        run: cd build/bin && zip -r klyradb-macos-arm64.zip klyradb.app

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klyradb-${{ matrix.name }}
          path: |
            build/bin/klyradb-linux-amd64
            build/bin/klyradb-windows-amd64.exe
            build/bin/klyradb-windows-amd64-setup.exe
            build/bin/klyradb-macos-arm64.zip
          if-no-files-found: ignore
          retention-days: 30

  snap:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        id: build
        run: |
          sudo snapcraft --destructive-mode
          echo "snap=$(ls klyradb_*.snap | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klyradb-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 30

      - name: Publish to Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=stable "${{ steps.build.outputs.snap }}"

  release:
    needs: [build, snap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "KlyraDB ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
