[package]
name = "klyradb"
version = "0.7.2"
edition = "2021"
rust-version = "1.96"
description = "Local database manager — run isolated PostgreSQL, MySQL, MariaDB, Valkey, Redis and MongoDB instances without Docker."
repository = "https://github.com/Glyndor/klyradb"
license = "Apache-2.0"
build = "build.rs"

# The structure standard mandates all product code under internal/, so the
# Cargo src/ default is overridden with explicit path keys.
[lib]
name = "klyradb"
path = "internal/lib.rs"

[[bin]]
name = "klyradb"
path = "internal/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
getrandom = "0.2"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
