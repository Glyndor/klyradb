name: klyradb
title: KlyraDB
base: core22
version: '0.7.2'
summary: Local database manager — PostgreSQL, MySQL, MariaDB, Redis, MongoDB
description: |
  KlyraDB manages isolated PostgreSQL, MySQL, MariaDB and Redis instances.
  No Docker. No config files. Just click and run.

  Engines are downloaded and installed on demand — only install what you need.

license: MIT
contact: https://github.com/Glyndor/klyradb/issues
website: https://github.com/Glyndor/klyradb
source-code: https://github.com/Glyndor/klyradb
issues: https://github.com/Glyndor/klyradb/issues
donation: https://github.com/sponsors/Jaro-c

grade: stable
confinement: strict
compression: lzo

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

architectures:
  - build-on: amd64

apps:
  klyradb:
    command: bin/klyradb
    desktop: share/applications/klyradb.desktop
    plugs:
      - network
      - network-bind
      - system-observe
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
    environment:
      DISPLAY: "${DISPLAY}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY}"
      XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR}"
      GIO_EXTRA_MODULES: "${SNAP}/usr/lib/x86_64-linux-gnu/gio/modules"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"

parts:
  klyradb:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libsoup-3.0-dev
      - libssl-dev
      - pkg-config
      - curl
      - ca-certificates
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --release --locked
      install -D target/release/klyradb $CRAFT_PART_INSTALL/bin/klyradb
      install -D icons/icon.png $CRAFT_PART_INSTALL/share/icons/hicolor/512x512/apps/klyradb.png
      install -D snap/local/klyradb.desktop $CRAFT_PART_INSTALL/share/applications/klyradb.desktop

  deps:
    plugin: nil
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - glib-networking
      - libglib2.0-0
      - shared-mime-info
